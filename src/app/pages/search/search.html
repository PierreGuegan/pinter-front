<div class="search-container">

  <input
    class="search-input"
    type="text"
    [(ngModel)]="query"
    (input)="onSearch()"
    placeholder="Rechercher une image, un artiste..."
  />

</div>

<div class="grid">

  <div class="card" *ngFor="let img of images">

    <img [src]="img.url" />

    <div class="info">
      {{ img.title }}
    </div>

  </div>

</div>
