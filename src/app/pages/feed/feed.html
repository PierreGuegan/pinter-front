<h1>FEED</h1>

<!-- DEBUG 
<pre>{{ images | json }}</pre> -->

<div class="grid">

  <div class="card" *ngFor="let img of images" (click)="openModal(img)">

    <img
      [src]="img.url"
      alt="image"
      style="width:300px;border:2px solid red;"
      (error)="onError(img)"
    />

    <div class="info">
      <p>{{ img.title || 'No title' }}</p>
    </div>

  </div>

</div>

<app-image-modal
  *ngIf="isModalOpen"
  [image]="selectedImage"
  (close)="closeModal()">
</app-image-modal>
