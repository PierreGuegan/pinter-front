<h1>FEED</h1>

<!-- DEBUG 
<pre>{{ images | json }}</pre> -->

<div class="grid">

  <div class="card" *ngFor="let img of images">

    <img
      [src]="img.url"
      alt="image"
      style="width:300px;border:2px solid red;"
      (error)="onError(img)"
    />

    <div class="info">
      <p>{{ img.title || 'No title' }}</p>
    </div>

  </div>

</div>
